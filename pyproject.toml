[project]
name = "geonode-scraper-sdk"
version = "0.6.2"
description = "Build web scraping pipelines in Python with typed clients that extract Markdown or HTML, crawl websites, discover URLs and search through the Geonode API."
authors = [
  {name = "Geonode Team"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["OpenAPI", "OpenAPI-Generator", "Scraper API"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

dependencies = [
  "urllib3 (>=2.1.0,<3.0.0)",
  "python-dateutil (>=2.8.2)",
  "pydantic (>=2.11)",
  "typing-extensions (>=4.7.1)",
]

[project.urls]
Repository = "https://github.com/geonodecom/sdk-python"
Issues = "https://github.com/geonodecom/sdk-python/issues"
Homepage = "https://geonode.com/integrations"
Documentation = "https://docs.geonode.com/docs/scraper-api/guides/sdks/python"
"Sign up" = "https://app.geonode.com/sign-up?utm_source=pypi&utm_medium=package&utm_campaign=python-sdk"

[project.optional-dependencies]
dev = [
  "pytest>=7.2.1",
  "pytest-cov>=2.8.1",
  "mypy>=1.5",
  "types-python-dateutil>=2.8.19.14",
  "ruff>=0.12.11",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geonode_scraper_sdk*"]

[tool.setuptools.package-data]
geonode_scraper_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [
  ".openapi-generator",
  "docs",
  "geonode_scraper_sdk",
  "geonode_scraper_sdk.egg-info",
  "test",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.mypy]
files = [
  "geonode_scraper_sdk",
  #"test",  # auto-generated tests
  "tests", # hand-written tests
]
# TODO: enable "strict" once all these individual checks are passing
# strict = true

# List from: https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

## Getting these passing should be easy
strict_equality = true
extra_checks = true

## Strongly recommend enabling this one as soon as you can
check_untyped_defs = true

## These shouldn't be too much additional work, but may be tricky to
## get passing if you use a lot of untyped libraries
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true

### These next few are various gradations of forcing use of type annotations
#disallow_untyped_calls = true
#disallow_incomplete_defs = true
#disallow_untyped_defs = true
#
### This one isn't too hard to get passing, but return on investment is lower
#no_implicit_reexport = true
#
### This one can be tricky to get passing if you use a lot of untyped libraries
#warn_return_any = true

[[tool.mypy.overrides]]
module = [
  "geonode_scraper_sdk.configuration",
]
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
